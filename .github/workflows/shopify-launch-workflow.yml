name: Shopify launch workflow

on:
  push:
    branches: [main]
    paths:
      - 'case-studies/shopify-launch-workflow/**'
      - '.github/workflows/shopify-launch-workflow.yml'
  pull_request:
    paths:
      - 'case-studies/shopify-launch-workflow/**'
      - '.github/workflows/shopify-launch-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-studies/shopify-launch-workflow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m launchkit rehearse --out out/ready
      - run: diff -u examples/results/ready.md out/ready/merchant-report.md
      - name: Check the blocked launch
        run: |
          rc=0
          python -m launchkit build --brief examples/hold-brief.json --out out/hold || rc=$?
          test "$rc" = 2
          diff -u examples/results/hold.md out/hold/merchant-report.md
          test ! -e out/hold/shopify-draft.csv
