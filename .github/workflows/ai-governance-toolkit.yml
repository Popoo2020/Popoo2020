name: AI Governance Toolkit

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'ISO42001-AI-Governance-Evidence-Toolkit/**'
      - '.github/workflows/ai-governance-toolkit.yml'

jobs:
  validate-toolkit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full toolkit validation
        working-directory: ISO42001-AI-Governance-Evidence-Toolkit
        run: |
          make validate
